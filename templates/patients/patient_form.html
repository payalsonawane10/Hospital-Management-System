{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="detail-toolbar"><a class="back-link" href="{% if patient %}{% url 'patients:detail' patient.pk %}{% else %}{% url 'patients:list' %}{% endif %}">← Back</a></div>
<section class="panel form-panel"><div class="form-heading"><h2>{{ page_title }}</h2><p>Enter the patient's information below.</p></div><form method="post" novalidate>{% csrf_token %}<div class="form-grid">{% for field in form %}<label class="form-field {% if field.name == 'address' or field.name == 'medical_history' %}full{% endif %}"><span>{{ field.label }}{% if field.field.required %} *{% endif %}</span>{{ field }}{% if field.errors %}<em>{{ field.errors|striptags }}</em>{% endif %}</label>{% endfor %}</div><div class="form-actions"><a class="secondary-button" href="{% if patient %}{% url 'patients:detail' patient.pk %}{% else %}{% url 'patients:list' %}{% endif %}">Cancel</a><button class="primary-button" type="submit">{{ submit_label }}</button></div></form></section>
{% endblock %}
